services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: borderless
      POSTGRES_PASSWORD: borderless
      POSTGRES_DB: borderless
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres on 5432.
      - '${DB_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U borderless -d borderless']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
